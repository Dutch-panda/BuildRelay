<svg xmlns="http://www.w3.org/2000/svg" width="760" height="498" viewBox="0 0 760 498" role="img" aria-labelledby="title desc">
<title id="title">Saved data and project memory</title><desc id="desc">Task checkpoints support resume. Workspace files and project profile support iterations. Vault artifacts record stages, supervision and evaluations.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b7b1a8"/></marker></defs>
<rect width="760" height="498" rx="12" fill="#151514"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#eeeae4;font-size:16px}.title{font-size:22px;font-weight:600}.sub{fill:#c4bdb2;font-size:14px}.accent{fill:#ffac75}.line{fill:none;stroke:#b7b1a8;stroke-width:1.6;marker-end:url(#arrow)}</style>
<text x="24" y="38" class="title" text-anchor="start">Three local records, different purposes</text>
<rect x="24" y="76" width="332" height="108" rx="8" fill="#23221f" stroke="#565048"/>
<text x="40" y="105" class="" text-anchor="start">Task ledger</text>
<text x="40" y="130" class="sub" text-anchor="start">.state/tasks.db</text>
<text x="40" y="152" class="sub" text-anchor="start">Stage outputs + attempts</text>
<rect x="428" y="76" width="308" height="108" rx="8" fill="#30251d" stroke="#9f704c"/>
<text x="444" y="105" class="accent" text-anchor="start">Resume</text>
<text x="444" y="130" class="sub" text-anchor="start">Reuse saved stages</text>
<text x="444" y="152" class="sub" text-anchor="start">Skip validated phases</text>
<path class="line" d="M356 130 H428"/>
<rect x="24" y="208" width="332" height="108" rx="8" fill="#23221f" stroke="#565048"/>
<text x="40" y="237" class="" text-anchor="start">Project workspace</text>
<text x="40" y="262" class="sub" text-anchor="start">Code + tests + README</text>
<text x="40" y="284" class="sub" text-anchor="start">PROJECT_PROFILE.md + .env</text>
<rect x="428" y="208" width="308" height="108" rx="8" fill="#30251d" stroke="#9f704c"/>
<text x="444" y="237" class="accent" text-anchor="start">Iterate</text>
<text x="444" y="262" class="sub" text-anchor="start">Reuse project context</text>
<text x="444" y="284" class="sub" text-anchor="start">Live verify + UI preview</text>
<path class="line" d="M356 262 H428"/>
<rect x="24" y="340" width="332" height="108" rx="8" fill="#23221f" stroke="#565048"/>
<text x="40" y="369" class="" text-anchor="start">Markdown vault</text>
<text x="40" y="394" class="sub" text-anchor="start">Briefs + dual specifications</text>
<text x="40" y="416" class="sub" text-anchor="start">Research + reviews + audits</text>
<rect x="428" y="340" width="308" height="108" rx="8" fill="#30251d" stroke="#9f704c"/>
<text x="444" y="369" class="accent" text-anchor="start">Inspect</text>
<text x="444" y="394" class="sub" text-anchor="start">Obsidian project links</text>
<text x="444" y="416" class="sub" text-anchor="start">Graphify lookup if available</text>
<path class="line" d="M356 394 H428"/>
<text x="24" y="480" class="sub" text-anchor="start">Back up ledger, workspace, and vault together. Keep credentials private.</text>
