</g>

<!-- 5. METI (Docker Sandbox Execution) -->
<g transform="translate(596, 138)" class="node-card" filter="url(#softShadow)">
  <rect width="114" height="94" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.6"/>
  <rect x="8" y="8" width="54" height="16" rx="4" fill="#f0fdf4" stroke="#4ade80" stroke-width="0.8"/>
  <text x="13" y="20" fill="#059669" font-size="8.5" font-weight="800">🔨 METI</text>
  <text x="8" y="43" fill="#0f172a" font-size="12" font-weight="750">Implementer</text>
  <text x="8" y="60" fill="#475569" font-size="9.5">Docker Sandbox</text>
  <text x="8" y="74" fill="#64748b" font-size="9">Unit Test Recovery</text>
  <rect x="8" y="80" width="98" height="2" rx="1" fill="#22c55e" opacity="0.6"/>
</g>

<!-- 6. VERIFIED DELIVERABLE -->
<g transform="translate(750, 138)" class="node-card" filter="url(#softShadow)">
  <rect width="164" height="94" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
  <rect x="8" y="8" width="86" height="16" rx="4" fill="#fff7ed" stroke="#fb923c" stroke-width="0.8"/>
