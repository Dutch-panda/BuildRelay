<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
<title id="title">BuildRelay Autonomous Workflow &amp; Supervision Architecture</title>
<desc id="desc">Dimmed-light visual pipeline featuring the 4 sequential leads, Dana omnipresent quality supervisory canopy, and Split-Pane Cockpit telemetry.</desc>

<defs>
  <!-- Ambient Dimmed Light Fantasy Glow Filters -->
  <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>

  <filter id="glowDana" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feFlood flood-color="#4f46e5" flood-opacity="0.25" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="bgLightGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="45%" stop-color="#eef2f6"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>

  <linearGradient id="danaPillGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#eef2ff"/>
    <stop offset="100%" stop-color="#faf5ff"/>
  </linearGradient>

  <linearGradient id="amberConduit" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0284c7"/>
    <stop offset="50%" stop-color="#d97706"/>
    <stop offset="100%" stop-color="#059669"/>
  </linearGradient>
</defs>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif; }

  /* Kinetic Animations */
  @keyframes conduitFlow {
    from { stroke-dashoffset: 32; }
    to { stroke-dashoffset: 0; }
  }

  @keyframes beamPulse {
    0%, 100% { opacity: 0.35; stroke-dashoffset: 40; }
    50% { opacity: 0.95; stroke-dashoffset: 0; }
  }

  @keyframes danaRadar {
    0% { r: 8; opacity: 0.9; stroke-width: 2; }
    100% { r: 24; opacity: 0; stroke-width: 0.5; }
  }

  @keyframes pulseNodeHover {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }

  @keyframes liveBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .pipe-base { stroke: #cbd5e1; stroke-width: 2; fill: none; }
  .pipe-flow { stroke-width: 2.5; fill: none; stroke-dasharray: 6 8; animation: conduitFlow 1.1s linear infinite; }
  .pipe-dana-beam { stroke: #4f46e5; stroke-width: 1.8; fill: none; stroke-dasharray: 4 6; animation: beamPulse 2.2s ease-in-out infinite; }
  
  .radar-ring { fill: none; stroke: #4f46e5; animation: danaRadar 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
  .live-dot { animation: liveBlink 1.4s ease-in-out infinite; }
  
  .node-card { transition: all 0.2s ease; }
  .node-card:hover { filter: drop-shadow(0 10px 20px rgba(15,23,42,0.12)); }

  @media (prefers-reduced-motion: reduce) {
    .pipe-flow, .pipe-dana-beam, .radar-ring, .live-dot {
      animation: none !important;
    }
  }
</style>

<!-- Canvas Dimmed Light Base Frame -->
<rect width="940" height="520" rx="16" fill="url(#bgLightGrad)" stroke="#cbd5e1" stroke-width="1.2"/>

<!-- Ambient Soft Radial Orbs -->
<circle cx="160" cy="140" r="140" fill="#7c3aed" opacity="0.04"/>
<circle cx="470" cy="50" r="160" fill="#4f46e5" opacity="0.05"/>
<circle cx="750" cy="180" r="150" fill="#059669" opacity="0.04"/>

<!-- Header Title HUD Bar -->
<g transform="translate(32, 22)">
  <circle cx="8" cy="10" r="5" fill="#059669" class="live-dot"/>
  <text x="22" y="14" fill="#0f172a" font-size="13" font-weight="750" letter-spacing="0.04em">AUTONOMOUS 4-LEAD ORCHESTRATION &amp; SUPERVISION</text>
  <text x="560" y="14" fill="#64748b" font-size="11.5">Omnipresent Dana Quality Canopy · Tier 1 Phased Docker Sandbox</text>
</g>

<!-- ================= DANA OMNIPRESENT SUPERVISORY CANOPY (Top) ================= -->
<g id="dana-supervisory-canopy" transform="translate(245, 46)">
  <!-- Dana Canopy Halo / Card -->
  <rect width="450" height="48" rx="24" fill="url(#danaPillGrad)" stroke="#4f46e5" stroke-width="1.6" filter="url(#glowDana)"/>
  
  <!-- Radar Beacon -->
  <circle cx="26" cy="24" r="6" fill="#4f46e5"/>
  <circle cx="26" cy="24" r="13" class="radar-ring"/>
  <circle cx="26" cy="24" r="20" class="radar-ring" style="animation-delay: 0.6s;"/>
  
  <text x="44" y="21" fill="#4f46e5" font-size="11" font-weight="800" letter-spacing="0.05em">⚖️ DANA QUALITY SUPERVISOR</text>
  <text x="44" y="35" fill="#64748b" font-size="9">Omnipresent Multi-Stage Audit &amp; Intent Verification Gate</text>
  
  <!-- Status Badge (Properly Padded and Centered) -->
  <rect x="334" y="13" width="96" height="22" rx="11" fill="#4f46e5"/>
  <text x="382" y="27.5" fill="#ffffff" font-size="9" font-weight="750" letter-spacing="0.03em" text-anchor="middle">AUTONOMOUS</text>
</g>

<!-- Dana Bidirectional Audit Conduits (Beams dropping to each milestone) -->
<!-- Beam 1: Dana to Natasha (Intent Scope Audit) -->
<path d="M 320 94 C 320 115, 195 110, 195 138" class="pipe-dana-beam"/>
<circle cx="195" cy="138" r="3.5" fill="#4f46e5"/>

<!-- Beam 2: Dana to Taghi & Diba (Dual-Spec Verification Audit) -->
<path d="M 450 94 L 450 138" class="pipe-dana-beam" style="animation-delay: 0.5s;"/>
<circle cx="450" cy="138" r="3.5" fill="#4f46e5"/>

<!-- Beam 3: Dana to Meti (Sandbox Validation Audit) -->
<path d="M 570 94 C 570 115, 685 110, 685 138" class="pipe-dana-beam" style="animation-delay: 1.0s;"/>
<circle cx="685" cy="138" r="3.5" fill="#4f46e5"/>

<!-- Beam 4: Dana to Verified Delivery (100-pt Scorecard Gate) -->
<path d="M 650 85 C 720 85, 840 95, 840 138" class="pipe-dana-beam" style="animation-delay: 1.5s;"/>
<circle cx="840" cy="138" r="3.5" fill="#4f46e5"/>

<!-- ================= SEQUENTIAL DEVELOPMENT PIPELINE ================= -->

<!-- Conduit 0: Input to Natasha -->
<path d="M 105 185 L 138 185" class="pipe-base"/>
<path d="M 105 185 L 138 185" stroke="#7c3aed" class="pipe-flow"/>

<!-- Conduit 1: Natasha to Odin (Research branch) -->
<path d="M 252 165 C 270 165, 275 220, 298 220" class="pipe-base"/>
<path d="M 252 165 C 270 165, 275 220, 298 220" stroke="#0284c7" class="pipe-flow"/>

<!-- Conduit 2: Natasha to Taghi (Direct architecture) -->
<path d="M 252 175 L 298 175" class="pipe-base"/>
<path d="M 252 175 L 298 175" stroke="#d97706" class="pipe-flow"/>

<!-- Conduit 3: Odin up to Taghi (Research context feed) -->
<path d="M 355 198 L 355 188" class="pipe-base"/>
<path d="M 355 198 L 355 188" stroke="#0284c7" class="pipe-flow"/>

<!-- Conduit 4: Taghi to Diba (UI/UX specs) -->
<path d="M 412 175 L 442 175" class="pipe-base"/>
<path d="M 412 175 L 442 175" stroke="#db2777" class="pipe-flow"/>

<!-- Conduit 5: Diba to Meti (Phased Docker Execution) -->
<path d="M 556 175 L 596 175" class="pipe-base"/>
<path d="M 556 175 L 596 175" stroke="#059669" class="pipe-flow"/>

<!-- Conduit 6: Meti to Delivery -->
<path d="M 710 175 L 750 175" class="pipe-base"/>
<path d="M 710 175 L 750 175" stroke="#ea580c" class="pipe-flow"/>

<!-- ================= PIPELINE STAGE NODES (White Floating Cards) ================= -->

<!-- 0. PROMPT INGESTION -->
<g transform="translate(24, 148)" class="node-card" filter="url(#softShadow)">
  <rect width="82" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="8" y="9" width="34" height="15" rx="4" fill="#ffedd5"/>
  <text x="13" y="20" fill="#c2410c" font-size="8.5" font-weight="800">INPUT</text>
  <text x="8" y="42" fill="#0f172a" font-size="11" font-weight="700">Goal Prompt</text>
  <text x="8" y="58" fill="#64748b" font-size="9">CLI / Session</text>
</g>

