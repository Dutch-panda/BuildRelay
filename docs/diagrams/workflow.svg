  <text x="8" y="60" fill="#059669" font-size="9.5" font-weight="700">✔ Docker Passed · 100/100</text>
  <text x="8" y="74" fill="#64748b" font-size="9">Live Smoke Script + Memory</text>
  <rect x="8" y="80" width="148" height="2" rx="1" fill="#ea580c" opacity="0.6"/>
</g>

