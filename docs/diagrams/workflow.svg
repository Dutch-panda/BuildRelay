<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-labelledby="title desc">
<title id="title">BuildRelay workflow</title><desc id="desc">Four sequential leads with optional Dana supervision. The full research route is shown; simpler tasks skip stages and research-only ends after Odin.</desc>
