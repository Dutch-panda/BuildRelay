  <rect width="114" height="94" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.6"/>
  <rect x="8" y="8" width="68" height="16" rx="4" fill="#faf5ff" stroke="#c084fc" stroke-width="0.8"/>
  <text x="13" y="20" fill="#7c3aed" font-size="8.5" font-weight="800">🟣 NATASHA</text>
  <text x="8" y="43" fill="#0f172a" font-size="12" font-weight="750">Routing Lead</text>
