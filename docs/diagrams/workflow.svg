  <rect x="6" y="6" width="56" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="10" y="16" fill="#b45309" font-size="8" font-weight="800">🟢 TAGHI</text>
  <text x="6" y="33" fill="#0f172a" font-size="11" font-weight="750">Architect</text>
