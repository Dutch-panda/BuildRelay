<text x="224" y="121" class="" text-anchor="start">Odin</text>
<text x="224" y="146" class="sub" text-anchor="start">Vault + web search</text>
<text x="224" y="168" class="sub" text-anchor="start">Research report</text>
<rect x="392" y="92" width="160" height="110" rx="8" fill="#23221f" stroke="#565048"/>
<text x="408" y="121" class="" text-anchor="start">Taghi</text>
<text x="408" y="146" class="sub" text-anchor="start">Backend + UI specs</text>
<text x="408" y="168" class="sub" text-anchor="start">Approval gate</text>
<rect x="576" y="92" width="160" height="110" rx="8" fill="#23221f" stroke="#565048"/>
