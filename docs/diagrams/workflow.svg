<path class="line" d="M184 147 H208"/>
<path class="line" d="M368 147 H392"/>
<path class="line" d="M552 147 H576"/>
<text x="24" y="233" class="sub" text-anchor="start">Research-only: stop after Odin. Design: Taghi → Meti. Direct build: Meti.</text>
<rect x="24" y="259" width="712" height="84" rx="8" fill="#30251d" stroke="#9f704c"/>
<text x="40" y="288" class="accent" text-anchor="start">Dana · optional supervisor</text>
<text x="40" y="313" class="sub" text-anchor="start">Advisory critique or autonomous steering at stage boundaries.</text>
<text x="24" y="380" class="accent" text-anchor="start">Delivery → live verification / preview → next feature or project session</text>
<text x="24" y="414" class="sub" text-anchor="start">Checkpoints preserve stages and phase history; review generated work.</text>
