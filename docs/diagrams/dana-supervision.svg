<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" aria-labelledby="title desc">
<title id="title">Supervision and evaluation</title><desc id="desc">Dana model critiques stage outputs; a separate static evaluation harness scores workspace patterns. Neither is an independent security audit or correctness proof.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b7b1a8"/></marker></defs>
<rect width="760" height="456" rx="12" fill="#151514"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#eeeae4;font-size:16px}.title{font-size:22px;font-weight:600}.sub{fill:#c4bdb2;font-size:14px}.accent{fill:#ffac75}.line{fill:none;stroke:#b7b1a8;stroke-width:1.6;marker-end:url(#arrow)}</style>
<text x="24" y="38" class="title" text-anchor="start">Two complementary quality signals</text>
<rect x="24" y="78" width="340" height="264" rx="8" fill="#30251d" stroke="#9f704c"/>
<text x="40" y="107" class="accent" text-anchor="start">Dana · model critique</text>
<text x="40" y="132" class="sub" text-anchor="start">Input: stage deliverable + context</text>
<text x="40" y="154" class="sub" text-anchor="start">approve / suggest / warn / block</text>
<text x="40" y="176" class="sub" text-anchor="start">Advisory: developer chooses</text>
<text x="40" y="198" class="sub" text-anchor="start">Autonomous: steering prompts</text>
<text x="40" y="220" class="sub" text-anchor="start"></text>
<text x="40" y="242" class="sub" text-anchor="start">Model judgment, not a proof.</text>
<text x="40" y="264" class="sub" text-anchor="start">vault/supervision/</text>
<rect x="396" y="78" width="340" height="264" rx="8" fill="#23221f" stroke="#565048"/>
<text x="412" y="107" class="" text-anchor="start">Evaluation · static heuristics</text>
<text x="412" y="132" class="sub" text-anchor="start">Input: generated workspace files</text>
<text x="412" y="154" class="sub" text-anchor="start">5 dimensions × 20 points</text>
<text x="412" y="176" class="sub" text-anchor="start">Tests, security patterns, UI,</text>
<text x="412" y="198" class="sub" text-anchor="start">live readiness, architecture</text>
<text x="412" y="220" class="sub" text-anchor="start"></text>
<text x="412" y="242" class="sub" text-anchor="start">Does not execute acceptance tests.</text>
<text x="412" y="264" class="sub" text-anchor="start">vault/evaluations/</text>
<text x="24" y="380" class="sub" text-anchor="start">Scores are not comparable benchmarks or guarantees of code quality.</text>
<text x="24" y="416" class="accent" text-anchor="start">Use alongside phase results, live checks, and human review.</text>
</svg>
