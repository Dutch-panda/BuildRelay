<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Two-tier verification</title><desc id="desc">Tier 1 targets deterministic mocked tests inside Docker. Tier 2 runs generated live verification scripts on the host with project credentials. Docker networking is enabled.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b7b1a8"/></marker></defs>
<rect width="760" height="430" rx="12" fill="#151514"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#eeeae4;font-size:16px}.title{font-size:22px;font-weight:600}.sub{fill:#c4bdb2;font-size:14px}.accent{fill:#ffac75}.line{fill:none;stroke:#b7b1a8;stroke-width:1.6;marker-end:url(#arrow)}</style>
<text x="24" y="38" class="title" text-anchor="start">Two tiers, two different kinds of evidence</text>
<rect x="24" y="78" width="340" height="254" rx="8" fill="#23221f" stroke="#565048"/>
<text x="40" y="107" class="" text-anchor="start">Tier 1 · Docker phase checks</text>
<text x="40" y="132" class="sub" text-anchor="start">Target: local fixtures + mocks</text>
<text x="40" y="154" class="sub" text-anchor="start">Exact commands, declared order</text>
<text x="40" y="176" class="sub" text-anchor="start">3 total attempts / phase / run</text>
<text x="40" y="198" class="sub" text-anchor="start"></text>
<text x="40" y="220" class="sub" text-anchor="start">Backend-first plan, then UI</text>
<text x="40" y="242" class="sub" text-anchor="start">Networking remains enabled.</text>
<rect x="396" y="78" width="340" height="254" rx="8" fill="#30251d" stroke="#9f704c"/>
<text x="412" y="107" class="accent" text-anchor="start">Tier 2 · guided live checks</text>
<text x="412" y="132" class="sub" text-anchor="start">buildrelay verify &lt;project&gt;</text>
<text x="412" y="154" class="sub" text-anchor="start">Host scripts + real credentials</text>
<text x="412" y="176" class="sub" text-anchor="start">External service behavior</text>
<text x="412" y="198" class="sub" text-anchor="start"></text>
<text x="412" y="220" class="sub" text-anchor="start">Preview serves the local UI.</text>
<text x="412" y="242" class="sub" text-anchor="start">Inspect generated scripts first.</text>
<text x="24" y="370" class="sub" text-anchor="start">Tier 1 passing does not mean Tier 2 ran or the UI was browser-tested.</text>
<text x="24" y="402" class="sub" text-anchor="start">Offline tests are a design target, not an enforced network boundary.</text>
</svg>
